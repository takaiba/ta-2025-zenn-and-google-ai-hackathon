name: Trusted public security checks
on:
  workflow_call:
permissions:
  contents: read

# Full-SHA-pinned runner-group boundary. Forks and unapproved actors never get a VM.
jobs:
  frontend:
    if: ${{ github.repository == 'takaiba/ta-2025-zenn-and-google-ai-hackathon' && github.actor == 'p0x0q' && ((github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/27978-selfhosted-linux'))) }}
    runs-on: { group: public-ci-trusted, labels: [linux-vm] }
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ta-frontend
    env:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_APP_USER: test
      POSTGRES_PASSWORD: test
      DATABASE_ROOT_URL: postgresql://test:test@localhost:5432/test
      DATABASE_APP_URL: postgresql://test:test@localhost:5432/test
      AUTH0_SECRET: test
      APP_BASE_URL: http://localhost:3000
      AUTH0_DOMAIN: example.com
      AUTH0_CLIENT_ID: test
      AUTH0_CLIENT_SECRET: test
      DEFAULT_TENANT_ID: test
      DEFAULT_ADMIN_EMAIL: test@example.com
      SLACK_CLIENT_ID: test
      SLACK_CLIENT_SECRET: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: pnpm
          cache-dependency-path: ta-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/test-lodash-security.cjs
      - run: pnpm prisma generate
      - run: pnpm build

  backend-dependencies:
    if: ${{ github.repository == 'takaiba/ta-2025-zenn-and-google-ai-hackathon' && github.actor == 'p0x0q' && ((github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/27978-selfhosted-linux'))) }}
    runs-on: { group: public-ci-trusted, labels: [linux-vm] }
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ta-backend-ml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ta-backend-ml/requirements.txt
      - run: pip install --dry-run -r requirements.txt
      - run: python -m compileall project

  django-security:
    if: ${{ github.repository == 'takaiba/ta-2025-zenn-and-google-ai-hackathon' && github.actor == 'p0x0q' && ((github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/27978-selfhosted-linux'))) }}
    runs-on: { group: public-ci-trusted, labels: [linux-vm] }
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ta-backend-ml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify baseline compatibility and reproduce both Django vulnerabilities
        run: |
          pip install Django==4.2.27 celery==5.3.4 'sentry-sdk[django]==1.29.2'
          python scripts/test_django_security.py ApplicationCompatibilityTests
          set +e
          python scripts/test_django_security.py DjangoSecurityTests > django-baseline.log 2>&1
          result=$?
          set -e
          cat django-baseline.log
          test "$result" -ne 0
          grep -q 'FAILED (failures=2)' django-baseline.log
      - name: Verify fixed Django and application compatibility
        run: |
          pip install "$(grep '^Django==' requirements.txt)" "$(grep '^sentry-sdk' requirements.txt)" mypy
          pip check
          python scripts/test_django_security.py
          mypy --follow-imports=skip --ignore-missing-imports --check-untyped-defs scripts/test_django_security.py

  gunicorn-security:
    if: ${{ github.repository == 'takaiba/ta-2025-zenn-and-google-ai-hackathon' && github.actor == 'p0x0q' && ((github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/27978-selfhosted-linux'))) }}
    runs-on: { group: public-ci-trusted, labels: [linux-vm] }
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ta-backend-ml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Demonstrate both regressions on vulnerable Gunicorn
        run: |
          pip install gunicorn==21.2.0 Django==4.2.27
          python scripts/test_gunicorn_security.py -k test_valid_
          set +e
          python scripts/test_gunicorn_security.py -k test_cve_ > baseline.log 2>&1
          result=$?
          set -e
          cat baseline.log
          test "$result" -ne 0
          grep -q 'FAILED (failures=2)' baseline.log
      - name: Verify patched framing and Django threaded WSGI compatibility
        run: |
          pip install "$(grep '^gunicorn==' requirements.txt)" "$(grep '^Django==' requirements.txt)"
          pip check
          python scripts/test_gunicorn_security.py
