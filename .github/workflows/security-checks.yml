name: Trusted public security checks
on:
  workflow_call:
permissions:
  contents: read

# Full-SHA-pinned runner-group boundary. Forks and unapproved actors never get a VM.
jobs:
  frontend:
    if: ${{ github.repository == 'takaiba/ta-2025-zenn-and-google-ai-hackathon' && github.actor == 'p0x0q' && ((github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/27978-selfhosted-linux'))) }}
    runs-on: { group: public-ci-trusted, labels: [linux-vm] }
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ta-frontend
    env:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_APP_USER: test
      POSTGRES_PASSWORD: test
      DATABASE_ROOT_URL: postgresql://test:test@localhost:5432/test
      DATABASE_APP_URL: postgresql://test:test@localhost:5432/test
      AUTH0_SECRET: test
      APP_BASE_URL: http://localhost:3000
      AUTH0_DOMAIN: example.com
      AUTH0_CLIENT_ID: test
      AUTH0_CLIENT_SECRET: test
      DEFAULT_TENANT_ID: test
      DEFAULT_ADMIN_EMAIL: test@example.com
      SLACK_CLIENT_ID: test
      SLACK_CLIENT_SECRET: test
    steps:
      - name: Verify the dedicated disposable public VM
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          
          # The fixed infra-mcp JIT pool reboots after one job, discarding its overlayroot
          # and scratch disk. Never run these effects in an ARC container or a live node.
          test "${RUNNER_ENVIRONMENT:-}" = self-hosted
          test "${RUNNER_OS:-}" = Linux
          test "${RUNNER_ARCH:-}" = X64
          # Fixed takaiba pools in the Shibuya/Tochigi JIT manifests. The broker adds a
          # six-hex registration suffix; 08 is another org and 28 is the Android pool.
          if [[ ! ${RUNNER_NAME:-} =~ ^gha-linux-25(-[a-f0-9]{6})?$ ]]; then
            echo 'Unrecognized Linux VM runner' >&2; exit 1
          fi
          test "$(id -u)" -ne 0
          systemd-detect-virt --vm --quiet
          if systemd-detect-virt --container --quiet; then echo 'Container runner refused' >&2; exit 1; fi
          mountpoint -q /media/root-ro
          test "$(findmnt -n -o FSTYPE /)" = overlay
          test "$(findmnt -n -o FSTYPE /run)" = tmpfs
          case ",$(findmnt -n -o OPTIONS /media/root-ro)," in *,ro,*) ;; *) echo 'Read-only VM base required' >&2; exit 1 ;; esac
          # mkdir is intentionally not idempotent: a second job in the same boot refuses.
          sudo mkdir -m 0700 /run/takaiba-ci-first-job
          sudo mount -o remount,exec /run
          python3 - <<'PY' | tee "$RUNNER_TEMP/linux-vm-proof.json"
          import json, os, platform
          print(json.dumps({"runnerName": os.environ["RUNNER_NAME"], "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"], "kernel": platform.release(),
              "bootId": open('/proc/sys/kernel/random/boot_id').read().strip(),
              "readOnlyBase": True, "overlayRoot": True, "firstJobThisBoot": True}))
          PY
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: pnpm
          cache-dependency-path: ta-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/test-lodash-security.cjs
      - run: pnpm prisma generate
      - run: pnpm build

  backend-dependencies:
    if: ${{ github.repository == 'takaiba/ta-2025-zenn-and-google-ai-hackathon' && github.actor == 'p0x0q' && ((github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/27978-selfhosted-linux'))) }}
    runs-on: { group: public-ci-trusted, labels: [linux-vm] }
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ta-backend-ml
    steps:
