              "bootId": open('/proc/sys/kernel/random/boot_id').read().strip(),
              "readOnlyBase": True, "overlayRoot": True, "firstJobThisBoot": True}))
          PY
      - name: Require every security check, including admission, to succeed
        shell: bash
        env:
          RESULT_0: ${{ needs.admission.result }}
          RESULT_1: ${{ needs.frontend.result }}
          RESULT_2: ${{ needs.backend-dependencies.result }}
          RESULT_3: ${{ needs.django-security.result }}
          RESULT_4: ${{ needs.gunicorn-security.result }}
        run: |
          # BEGIN SECURITY_RESULT
          for result in "$RESULT_0" "$RESULT_1" "$RESULT_2" "$RESULT_3" "$RESULT_4"; do
            if [[ "$result" != success ]]; then
              echo '::error::Security verification blocked or incomplete; repository writer review required'
              exit 1
            fi
          done
          echo 'security-verification=passed'
          # END SECURITY_RESULT
