name: Security dependency CI

on:
  pull_request:
    branches: [main]
    paths:
      - "ta-frontend/**"
      - "ta-backend-ml/requirements.txt"
      - "ta-backend-ml/scripts/test_gunicorn_security.py"
      - "ta-backend-ml/scripts/test_django_security.py"
      - ".github/workflows/security-ci.yml"
      - ".github/workflows/security-checks.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: ${{ github.repository == 'takaiba/ta-2025-zenn-and-google-ai-hackathon' && github.actor == 'p0x0q' && ((github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/27978-selfhosted-linux'))) }}
    uses: takaiba/ta-2025-zenn-and-google-ai-hackathon/.github/workflows/security-checks.yml@082b966753077e7f4e87ff2ef463b8f2e275cf29
