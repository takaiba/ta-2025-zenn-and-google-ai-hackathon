name: Security dependency CI

on:
  pull_request:
    branches: [main]
    paths:
      - "ta-frontend/**"
      - "ta-backend-ml/requirements.txt"
      - "ta-backend-ml/scripts/test_gunicorn_security.py"
      - "ta-backend-ml/scripts/test_django_security.py"
      - ".github/workflows/security-ci.yml"
      - ".github/workflows/security-checks.yml"
      - "scripts/test-security-ci-policy.mjs"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    # Always report admission refusal as a failed check; never silently skip security.
    uses: takaiba/ta-2025-zenn-and-google-ai-hackathon/.github/workflows/security-checks.yml@02cd914e78faae9457565bba28548dde8db9012e
